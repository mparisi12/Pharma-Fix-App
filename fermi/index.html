<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#245a7a">
<title>Pharma-Fix</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Pharma-Fix">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#e9edf0; --surface:#ffffff; --surface2:#f3f6f8; --ink:#152028; --muted:#4d5b66; --line:#c9d2d9;
  --steel:#245a7a; --steel-ink:#ffffff; --steel-soft:#e3edf3; --amber:#c98600; --amber-ink:#6b4600; --amber-soft:#fff3d6;
  --ok:#2b8456; --ok-soft:#dff1e7; --crit:#c23b2a; --crit-soft:#fbe4e0; --yel:#f2cc1d; --yel-ink:#3d3100;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101519; --surface:#192127; --surface2:#1f2930; --ink:#e4ebef; --muted:#9aaab4; --line:#2e3a42;
  --steel:#5f9ec4; --steel-ink:#0d1418; --steel-soft:#1d3240; --amber:#f0b429; --amber-ink:#f6d48a; --amber-soft:#3a2f12;
  --ok:#4cb67f; --ok-soft:#173528; --crit:#e5654f; --crit-soft:#3d1e19; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
button,input,textarea{font:inherit;color:inherit}
button,a{cursor:pointer}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:center;gap:10px;padding-block:14px 4px}
.brand{font:700 26px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;flex:1}
.brand small{display:block;font:500 11px/1.4 var(--mono);letter-spacing:.06em;color:var(--muted);margin-top:4px;text-transform:none}
.manbtn{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 12px;font-size:13px;font-weight:500;max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:flex;align-items:center;gap:6px;font:500 11px var(--mono);color:var(--muted);margin-bottom:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.dot.warn{background:var(--amber)}.dot.off{background:var(--crit)}.dot.demo{background:var(--muted)}
.banner{background:var(--amber-soft);border:1px solid var(--amber);border-radius:var(--r);padding:10px 12px;font-size:13px;margin-block:6px;color:var(--amber-ink)}
h2{font:700 17px/1.2 var(--display);letter-spacing:.07em;text-transform:uppercase;margin:22px 0 10px;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline}
h2 .more{font:600 13px var(--body);letter-spacing:0;text-transform:none;color:var(--steel);background:none;border:0;padding:0}
.label{font:500 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.center{text-align:center}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.list{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:16px;color:var(--muted);text-align:center;font-size:14px}

/* Pulsante FERMO (home) */
.fermocard{display:flex;flex-direction:column;gap:10px;width:100%;border:0;background:var(--crit);color:#fff;border-radius:16px;padding:18px;text-align:left}
.fermocard .row{display:flex;align-items:center;gap:14px}
.fermocard .qr{width:58px;height:58px;border-radius:12px;background:#fff;color:#c23b2a;display:flex;align-items:center;justify-content:center;flex:none}
.fermocard .qr svg{width:36px;height:36px}
.fermocard .t1{font:700 32px/1 var(--display);letter-spacing:.04em}
.fermocard .t2{font:600 19px var(--display);letter-spacing:.04em;margin-top:4px}
.fermocard .steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;font-size:12px;font-weight:600}
.fermocard .steps span{background:#a32f20;border-radius:8px;padding:6px 4px;text-align:center}
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;min-height:44px;text-align:center}
.tile svg{width:22px;height:22px}
.tiles2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile2{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;display:flex;flex-direction:column;gap:6px;text-align:left;position:relative}
.tile2 svg{width:26px;height:26px}
.tile2 b{font:700 18px var(--display);letter-spacing:.03em}
.tile2 span{font-size:12px;color:var(--muted)}
.tile2 .n{position:absolute;top:10px;right:10px;font:500 12px var(--mono);background:var(--steel-soft);color:var(--steel);border-radius:10px;padding:1px 8px}

/* Fermi */
.ocard{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.ocard .bar{width:6px;align-self:stretch;background:var(--amber);border-radius:3px}
.ocard .what{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0}
.ocard .ln{font:700 19px/1.1 var(--display);letter-spacing:.03em}
.ocard .mc{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font:500 17px var(--mono);color:#9a6500;font-variant-numeric:tabular-nums}
@media (prefers-color-scheme:dark){.timer{color:var(--amber)}}
.closebtn{border:0;border-radius:10px;background:var(--ok);color:#fff;font:700 16px var(--display);letter-spacing:.06em;text-transform:uppercase;padding:14px}
.hrow{display:flex;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:100%;text-align:left}
.hrow > div{min-width:0;flex:1}
.hrow .t1{font-weight:600;font-size:14px}
.hrow .t2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dur{font:500 14px var(--mono);font-variant-numeric:tabular-nums;text-align:right;flex:none!important}
.pend{font:500 10px var(--mono);color:var(--amber);display:block;text-align:right}

/* Scheda macchina */
.topline{display:flex;align-items:center;gap:10px;margin-top:4px}
.back{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none}
.back svg{width:20px;height:20px}
.code{font:500 13px var(--mono);color:var(--muted)}
.ptitle{font:700 24px/1 var(--display);text-transform:uppercase}
.eqtitle h1{margin:12px 0 2px;font:700 36px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;overflow-wrap:anywhere}
.fermobanner{display:flex;align-items:center;gap:10px;background:var(--amber-soft);border:1px solid var(--amber);border-radius:var(--r);padding:10px 12px;margin-top:14px;color:var(--amber-ink)}
.fermobanner .timer{font-size:20px;color:inherit}
.bigbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;border:0;border-radius:14px;background:var(--crit);color:#fff;font:700 24px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;padding:20px 16px;margin-top:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-block:14px}
.stat{background:var(--surface);padding:10px}
.stat .v{font:700 24px/1.1 var(--display);margin-top:3px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat .v.sm{font-size:16px;line-height:1.5}

/* Urgenza */
.urg{display:inline-flex;align-items:center;font:700 12px var(--display);letter-spacing:.05em;border-radius:6px;padding:3px 8px;white-space:nowrap}
.u1{background:var(--crit);color:#fff}.u2{background:var(--yel);color:var(--yel-ink)}.u3{background:var(--ok);color:#fff}
.qrbtn{display:flex;align-items:center;gap:6px;border:0;border-radius:10px;background:var(--steel);color:var(--steel-ink);font:700 15px var(--display);letter-spacing:.06em;padding:10px 12px;min-height:44px;flex:none}
.qrbtn svg{width:20px;height:20px}
.urgpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.urgpick button{border:3px solid transparent;border-radius:10px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.urgpick button b{font:700 26px/1 var(--display)}
.urgpick button span{font:700 14px var(--display);letter-spacing:.02em;max-width:100%;overflow:hidden;text-overflow:ellipsis}
@media (max-width:400px){.urgpick button span{font-size:12.5px;letter-spacing:0}}
.urgpick button[aria-pressed="true"] b::after{content:" \2713";font-size:20px}
.urgpick button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px #fff}
.acard{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;width:100%;text-align:left}
.acard > div{flex:1;min-width:0}
.acard .t1{font-weight:600;font-size:14px}
.acard .t2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .age{font-size:12px;color:var(--muted);flex:none}

/* Soluzioni e documenti */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:46px;margin-top:12px}
.search input{border:0;outline:0;flex:1;background:transparent;font-size:16px;min-width:0}
.search svg{width:18px;height:18px;flex:none;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px;text-align:left}
.chip[aria-pressed="true"]{background:var(--steel);border-color:var(--steel);color:var(--steel-ink)}
.chips.big .chip{font:700 18px var(--display);letter-spacing:.04em;min-width:76px;text-align:center;min-height:44px}
.filters{margin-top:10px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.scard .tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font:500 11px var(--mono);border-radius:6px;padding:3px 7px}
.tag.g{background:var(--steel-soft);color:var(--steel)}
.tag.v{background:var(--ok-soft);color:var(--ok)}
.tag.f{background:var(--amber-soft);color:var(--amber-ink)}
.scard .meta{margin-left:auto;font-size:12px;color:var(--muted)}
.scard .prob{font-weight:600}
.scard .sol{background:var(--surface2);border-radius:8px;padding:8px 10px;font-size:14px;white-space:pre-line}
.scard .ric{display:flex;gap:6px;flex-wrap:wrap}
.scard .ric span{font:500 12px var(--mono);border:1px solid var(--line);border-radius:6px;padding:3px 7px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:12px}
.seg button{border:0;background:none;padding:12px 6px;font:700 16px var(--display);letter-spacing:.05em}
.seg button[aria-pressed="true"]{background:var(--steel);color:var(--steel-ink)}
.drow{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-decoration:none;color:inherit}
.drow .ico{width:44px;height:52px;border-radius:6px;background:var(--crit-soft);color:var(--crit);display:flex;align-items:center;justify-content:center;font:500 11px var(--mono);flex:none}
.drow .ico.s{background:var(--steel-soft);color:var(--steel)}
.drow > div{flex:1;min-width:0}
.drow .t1{font-weight:600}
.drow .t2{font-size:12px;color:var(--muted)}
.drow svg{width:20px;height:20px;color:var(--steel);flex:none}
.addbtn{width:100%;border:0;border-radius:12px;background:var(--steel);color:var(--steel-ink);padding:16px;font:700 20px var(--display);letter-spacing:.06em;text-transform:uppercase;margin-top:14px}
.ctxbar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-top:12px}
.ctxbar > div{flex:1;min-width:0}
.ctxbar .t1{font-weight:600}
.linkbtn{background:none;border:0;color:var(--steel);font-weight:600;padding:10px 0;text-decoration:underline;text-underline-offset:3px}
.danger{color:var(--crit)}

/* Barra in basso */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));max-width:640px;margin:0 auto}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font:700 12px var(--display);letter-spacing:.08em;padding:4px 0;min-height:44px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--steel)}

/* Fogli a comparsa */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-h h3{margin:0;font:700 24px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.x{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:44px;height:44px;font-size:20px;line-height:1;flex:none}
.group{margin-top:16px}
.group > .label{display:block;margin-bottom:8px}
.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;font-size:16px}
textarea.field{min-height:64px;resize:vertical}
.err{color:var(--crit);font-size:13px;margin-top:8px}
.annot{border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#000;touch-action:manipulation}
.annot canvas{display:block;width:100%;height:auto}
.camtile{display:flex;align-items:center;gap:10px;border:1px dashed var(--steel);color:var(--steel);background:var(--surface);border-radius:10px;padding:14px;font-weight:600;width:100%}
.camtile svg{width:22px;height:22px}
.submit{width:100%;margin-top:20px;border:0;border-radius:12px;padding:18px;font:700 22px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--ok)}
.submit.red{background:var(--crit)}.submit.blue{background:var(--steel);color:var(--steel-ink)}
.scanner{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column}
.scanner video{flex:1;width:100%;object-fit:cover;min-height:0}
.scanner .frame{position:absolute;left:50%;top:42%;width:min(70vw,300px);aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.scanner .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:#000}
.scanner .bar button{background:#fff;color:#000;border:0;border-radius:10px;padding:12px 12px;font-weight:600}
.scanner .msg{position:absolute;left:0;right:0;top:calc(14px + env(safe-area-inset-top,0px));text-align:center;color:#fff;font-weight:600;text-shadow:0 1px 3px #000}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;font-weight:500;z-index:30;max-width:calc(100% - 32px)}
.login{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding:calc(32px + env(safe-area-inset-top,0px)) 16px 32px}
.login .in{max-width:420px;margin:0 auto}
.login h1{font:700 40px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0}
.login p{color:var(--muted)}
.login label{display:block;margin-top:16px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Pharma-Fix<small id="clock">—</small></div>
    <button class="manbtn" id="manbtn">—</button>
  </header>
  <div class="sync" id="sync"><span class="dot demo"></span><span>…</span></div>
  <div id="banner"></div>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Sezioni"><div class="in">
  <button data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg>HOME</button>
  <button data-nav="sol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M14 6a4 4 0 0 0-5 5l-5 5 3 3 5-5a4 4 0 0 0 5-5l-2.5 2.5-2.5-.5-.5-2.5z"/></svg>SOLUZIONI</button>
  <button data-nav="doc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/></svg>DOCUMENTI</button>
  <button data-nav="ano"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg>ANOMALIE</button>
</div></nav>
<div id="sheet"></div>
<div id="login" class="login" hidden><div class="in">
  <h1>Pharma-Fix</h1><div class="label" style="margin-top:6px">Manutenzione · accesso tecnico</div>
  <p>Inserisci nome e cognome. Devono essere nell'elenco dei manutentori abilitati.</p>
  <form id="lform" novalidate>
    <div id="pinwrap"><label class="label" for="lpin">Codice reparto</label><input class="field" id="lpin" type="password" autocomplete="off" inputmode="text">
      <div class="hint">Lo chiedi al responsabile. Serve solo la prima volta su questo telefono.</div></div>
    <label class="label" for="lnome">Nome</label><input class="field" id="lnome" autocomplete="given-name" autocapitalize="words" required>
    <label class="label" for="lcogn">Cognome</label><input class="field" id="lcogn" autocomplete="family-name" autocapitalize="words" required>
    <div class="err" id="lerr" hidden></div>
    <button class="submit" type="submit" id="lgo">Entra</button>
  </form>
</div></div>
<div id="scanwrap"></div>
<input id="cam" type="file" accept="image/*" capture="environment" hidden>
<input id="fileup" type="file" accept="image/*,application/pdf" hidden>

<script src="config.js"></script>
<script src="defaults.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" defer></script>
<script>
'use strict';
/* ================= Config & stato ================= */
const CFG = window.PF_CONFIG || {};
const MOCK = !CFG.API_URL;
const S = { equipment: PF_DEFAULTS.equipment, liste: PF_DEFAULTS.liste, guasti: {}, fermi: [], soluzioni: [], documenti: [], anomalie: [],
  loaded: false, view: { name: 'home' }, man: '', net: 'ok', lastSync: 0 };
let PENDING_EQ = null;
const SESSION_H = 9; // dopo 9 ore (un turno) si rifà l'accesso
let OUTBOX = load('outbox', []);

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
function load(k, d) { try { const v = localStorage.getItem('pf_' + k); return v == null ? d : JSON.parse(v); } catch { return d; } }
function save(k, v) { try { localStorage.setItem('pf_' + k, JSON.stringify(v)); return true; } catch { return false; } }

function allFermi() {
  const m = new Map(S.fermi.map(f => [f.id, { ...f }]));
  for (const op of OUTBOX) {
    if (op.action === 'open' && !m.has(op.id)) {
      m.set(op.id, { id: op.id, code: op.code, linea: op.linea, macchina: op.macchina, lotto: op.lotto, start: op.ts, stato: 'APERTO', man: op.manutentore, pending: true });
    } else if (op.action === 'close' && m.has(op.id)) {
      Object.assign(m.get(op.id), { stato: 'CHIUSO', end: op.ts, lotto: op.lotto || m.get(op.id).lotto, cat: op.categoria, int: op.intervento, guasto: op.guasto, altro: op.altro, man: op.manutentore, pending: true });
    } else if (op.action === 'cancel') m.delete(op.id);

  return [...m.values()].sort((a, b) => b.start - a.start);
}
function allSoluzioni() {
  const out = S.soluzioni.slice();

    const e = eqBy(op.code) || {};
    out.push({ id: op.id, ts: op.ts, dove: op.code || op.linea || 'TUTTE', linea: e.linea || op.linea || '', macchina: e.macchina || '', guasto: op.guasto, problema: op.problema, soluzione: op.soluzione, ricambi: op.ricambi, link: '', autore: op.manutentore, pending: true });
  }

}
function allAnomalie() {

let syncing = false, retryT = null;
async function sync() {
  if (syncing || (!MOCK && !getPin())) return; syncing = true; clearTimeout(retryT);
  try {
    while (OUTBOX.length) {
      const op = OUTBOX[0];
      try { await apiPost(op); }
      catch (e) {
        if (isPinErr(e)) { pinInvalid(); return; }
        if (e.server && /non trovat|solo fermi aperti|non abilitato|obbligatori|non valido|mancante/.test(e.message)) { toast('Scartato: ' + e.message); }
        else { S.net = 'off'; renderSync(); retryT = setTimeout(sync, 15000); return; }

}
function applyInit(j) {

/* ================= Foto e allegati ================= */
function capture(cb) {
  const i = $('#cam'); i.value = '';
  i.onchange = async () => { const f = i.files && i.files[0]; if (!f) return; try { cb(await loadImg(f)); } catch { toast('Foto non leggibile, riprova'); } };
  i.click();
}
function pickFile(cb) {
  const i = $('#fileup'); i.value = '';
  i.onchange = () => {
    const f = i.files && i.files[0]; if (!f) return;
    if (f.type.startsWith('image/')) { loadImg(f).then(img => cb({ name: f.name.replace(/\.\w+$/, '') + '.jpg', mime: 'image/jpeg', data: toJpeg(img, [], 1400, .75) })).catch(() => toast('File non leggibile')); return; }
    if (f.size > 3 * 1024 * 1024) { toast('PDF troppo grande: massimo 3 MB'); return; }
    const r = new FileReader(); r.onload = () => cb({ name: f.name, mime: f.type || 'application/pdf', data: String(r.result).split(',')[1] }); r.readAsDataURL(f);
  };
  i.click();
}
function loadImg(f) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(f); }); }
function drawCircles(x, circles, w, h) {
  const m = Math.min(w, h);
  for (const c of circles) { const r = c.r * m; x.lineWidth = Math.max(4, m * .014);
    x.strokeStyle = '#fff'; x.beginPath(); x.arc(c.x * w, c.y * h, r + x.lineWidth * .6, 0, 7); x.stroke();
    x.strokeStyle = '#ff2a2a'; x.beginPath(); x.arc(c.x * w, c.y * h, r, 0, 7); x.stroke(); }
}
function toJpeg(img, circles = [], max = 1024, q = .7) {
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
  x.drawImage(img, 0, 0, w, h); drawCircles(x, circles, w, h);
  return c.toDataURL('image/jpeg', q).split(',')[1];
}
// Foto con cerchi: disegna dentro el, aggiorna lo stato P {img, circles}
function photoBox(el, P, label) {
  const draw = () => {
    if (!P.img) { el.innerHTML = `<button class="camtile" type="button">${I.cam}${esc(label)}</button>`; el.querySelector('button').onclick = () => capture(im => { P.img = im; P.circles = []; draw(); }); return; }
    el.innerHTML = `<span class="label">${esc(label)}</span><div class="annot" style="margin-top:8px"><canvas></canvas></div>
      <div class="hint">Tocca la foto per cerchiare il punto. Tocca un cerchio per toglierlo. <button class="linkbtn" type="button" style="padding:0 0 0 6px">Rifai foto</button></div>`;
    const cv = el.querySelector('canvas'), s = Math.min(1, 900 / Math.max(P.img.naturalWidth, P.img.naturalHeight));
    cv.width = Math.round(P.img.naturalWidth * s); cv.height = Math.round(P.img.naturalHeight * s);
    const paint = () => { const x = cv.getContext('2d'); x.drawImage(P.img, 0, 0, cv.width, cv.height); drawCircles(x, P.circles, cv.width, cv.height); }; paint();
    cv.onpointerdown = e => { const r = cv.getBoundingClientRect(); const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height; const m = Math.min(cv.width, cv.height);
      const hit = P.circles.findIndex(c => Math.hypot((c.x - px) * cv.width, (c.y - py) * cv.height) < c.r * m);
      if (hit >= 0) P.circles.splice(hit, 1); else P.circles.push({ x: px, y: py, r: .11 }); paint(); };
    el.querySelector('.linkbtn').onclick = () => capture(im => { P.img = im; P.circles = []; draw(); });
  };
  draw();
}

/* ================= Scanner QR ================= */
let scanStream = null, scanRun = false, SCAN_CB = null;
// onEq: cosa fare con la macchina letta (default: apri/chiudi il fermo)
async function openScanner(onEq, msg) {
  SCAN_CB = typeof onEq === 'function' ? onEq : afterScan;
  $('#scanwrap').innerHTML = `<div class="scanner"><video id="vid" playsinline muted></video><div class="frame"></div>
    <div class="msg" id="smsg">${esc(typeof msg === 'string' ? msg : 'Inquadra il QR sulla macchina')}</div>
    <div class="bar"><button id="smanual">Scegli a mano</button><button id="sphoto">Fotografa QR</button><button id="sclose">Chiudi</button></div></div>`;
  $('#sclose').onclick = closeScanner;
  $('#smanual').onclick = () => { const cb = SCAN_CB; closeScanner(); pickSheet(eq => cb(eq)); };
  $('#sphoto').onclick = () => { const cb = SCAN_CB; closeScanner(); scanFromPhoto(cb); };
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
  } catch (e) { $('#smsg').textContent = 'Fotocamera live non disponibile: usa "Fotografa QR"'; return; }
  const v = $('#vid'); v.srcObject = scanStream; await v.play().catch(() => {});
  let det = null; try { if ('BarcodeDetector' in window) det = new BarcodeDetector({ formats: ['qr_code'] }); } catch {}
  const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
  scanRun = true;
  const tick = async () => {
    if (!scanRun) return;
    let text = null;
    try {
      if (v.readyState >= 2) {
        if (det) { const r = await det.detect(v); if (r[0]) text = r[0].rawValue; }
        else if (window.jsQR) {
          const w = Math.min(640, v.videoWidth), h = Math.round(v.videoHeight * w / v.videoWidth);
          cv.width = w; cv.height = h; cx.drawImage(v, 0, 0, w, h);
          const r = jsQR(cx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' }); if (r) text = r.data;
        }
      }
    } catch {}
    if (text) {
      const eq = parseQr(text);
      if (eq) { if (navigator.vibrate) navigator.vibrate(60); const cb = SCAN_CB; closeScanner(); cb(eq); return; }
      $('#smsg').textContent = 'QR non riconosciuto: ' + text.slice(0, 40);
    }
    setTimeout(tick, 150);
  };
  tick();
}
// Dopo il QR: scheda macchina + subito apertura del fermo (o chiusura, se già aperto)
function afterScan(eq) {
  go({ name: 'equip', code: eq.code });
  const f = allFermi().find(x => x.code === eq.code && x.stato === 'APERTO');
  needMan(() => f ? closeSheet(f) : openSheet(eq));
}
function scanFromPhoto(cb = afterScan) {
  capture(img => {
    const w = Math.min(1200, img.naturalWidth), h = Math.round(img.naturalHeight * w / img.naturalWidth);
    const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.drawImage(img, 0, 0, w, h);
    const r = window.jsQR ? jsQR(x.getImageData(0, 0, w, h).data, w, h) : null;
    const eq = r && parseQr(r.data);
    if (eq) cb(eq); else toast('Non riesco a leggere il QR: avvicinati e riprova');
  });
}
function closeScanner() { scanRun = false; if (scanStream) scanStream.getTracks().forEach(t => t.stop()); scanStream = null; $('#scanwrap').innerHTML = ''; }

  $('#go').onclick = () => needMan(() => {
    keep();
    const msg = !eq ? 'Scegli la macchina.' : !A.urg ? 'Scegli l\'urgenza (1, 2 o 3).' : !A.descr.trim() ? 'Scrivi cosa hai visto.' : '';
    if (msg) { const e = $('#aerr'); e.textContent = msg; e.hidden = false; return; }
    enqueue({ action: 'anomalia', id: uid('A'), code: eq.code, urgenza: A.urg, descr: A.descr.trim(), serve: A.serve.trim(), foto: A.img ? toJpeg(A.img, A.circles) : '', ts: Date.now(), manutentore: S.man });
    Object.assign(A, { urg: 0, img: null, circles: [], descr: '', serve: '' });
    toast('Anomalia segnalata'); go({ name: 'equip', code: eq.code });
  });
  bindCommon();
}
function openScannerOrPick(cb) { openScanner(cb, 'Inquadra il QR della macchina con l\'anomalia'); }
function anoSheet(id) {
  const a = allAnomalie().find(x => x.id === id); if (!a) return;
  sheet(`<div class="sheet-h"><div>${urgTag(a.urgenza)}<h3 style="margin-top:8px">${esc(a.linea)} · ${esc(nice(a.macchina))}</h3><div class="code">${esc(a.code)} · ${a.ts ? fmtDT(a.ts) : ''} · ${esc(a.da || '')}</div></div><button class="x" data-x aria-label="Chiudi">✕</button></div>
    <div class="group"><span class="label">Cosa è stato visto</span><div class="scard"><div>${esc(a.descr)}</div></div></div>
    ${a.serve ? `<div class="group"><span class="label">Cosa serve</span><div class="scard"><div>${esc(a.serve)}</div></div></div>` : ''}
    ${a.foto ? `<a class="linkbtn" href="${esc(a.foto)}" target="_blank" rel="noopener">Apri foto</a>` : ''}
    <div class="group"><span class="label">Stato</span><div><b>${esc(a.stato)}</b>${a.gestita ? ' · ' + esc(a.gestita) : ''}${a.note ? '<div class="hint">' + esc(a.note) + '</div>' : ''}</div></div>
    ${a.stato !== 'CHIUSA' ? `<div class="group"><label class="label" for="an">Nota · facoltativa</label><textarea class="field" id="an" placeholder="Cosa è stato fatto"></textarea></div>
      ${a.stato === 'APERTA' ? '<button class="submit blue" id="take">Prendo in carico</button>' : ''}
      <button class="submit" id="done" style="margin-top:10px">Chiudi anomalia</button>` : ''}
    <button class="linkbtn" data-goeq="${esc(a.code)}" style="margin-top:8px">Vai alla scheda macchina</button>`);
  const send = st => needMan(() => { enqueue({ action: 'anomaliaStato', id: a.id, stato: st, note: ($('#an') || {}).value || '', ts: Date.now(), manutentore: S.man }); closeSh(); toast(st === 'CHIUSA' ? 'Anomalia chiusa' : 'Presa in carico'); });
  const tk = $('#take'); if (tk) tk.onclick = () => send('IN CORSO');
  const dn = $('#done'); if (dn) dn.onclick = () => send('CHIUSA');
  $('[data-goeq]').onclick = () => { closeSh(); go({ name: 'equip', code: a.code }); };
}

/* ================= Fogli a comparsa ================= */
function sheet(html) {
  $('#sheet').innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  $('#scrim').onclick = e => { if (e.target.id === 'scrim') closeSh(); };
  $$('#sheet [data-x]').forEach(b => b.onclick = closeSh);
}
function closeSh() { $('#sheet').innerHTML = ''; }
function chips(list, sel, cls = '') { return list.map(v => `<button class="chip ${cls}" type="button" data-v="${esc(v)}" aria-pressed="${sel === v}">${esc(v)}</button>`).join(''); }
function singleChoice(el, onPick) { el.onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; el.querySelectorAll('[data-v]').forEach(x => x.setAttribute('aria-pressed', x === b)); onPick(b.dataset.v); }; }

/* ---- Accesso: nome + cognome verificati sull'elenco Manutentori ---- */
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z' ]/g, ' ').replace(/\s+/g, ' ').trim();
function findTecnico(nome, cognome) {
  const want = (norm(nome) + ' ' + norm(cognome)).split(' ').filter(Boolean).sort().join(' ');
  return (S.liste['Manutentori'] || []).find(m => norm(m).split(' ').sort().join(' ') === want) || null;
}
function getSession() {
  let s = null; try { s = JSON.parse(sessionStorage.getItem('pf_sess') || 'null'); } catch {}
  if (!s) s = load('sess', null);
  return s && s.exp > Date.now() && (S.liste['Manutentori'] || []).includes(s.man) ? s.man : '';
}
function showLogin() {
  S.man = ''; renderHeader(); $('#login').hidden = false;
  $('#pinwrap').hidden = MOCK || !!getPin(); $('#lpin').value = '';
  $('#lerr').hidden = true; $('#lnome').value = ''; $('#lcogn').value = '';
  setTimeout(() => $('#lnome').focus(), 50);
}
$('#lform').onsubmit = async e => {
  e.preventDefault();
  const n = $('#lnome').value, c = $('#lcogn').value, err = $('#lerr'), btn = $('#lgo');
  const fail = msg => { err.textContent = msg; err.hidden = false; btn.disabled = false; btn.textContent = 'Entra'; };
  if (!norm(n) || !norm(c)) return fail('Scrivi sia il nome sia il cognome.');
  if (!MOCK && !getPin()) {
    const pin = $('#lpin').value.trim();
    if (!pin) return fail('Inserisci il codice reparto.');
    btn.disabled = true; btn.textContent = 'Verifica…';
    try { applyInit(await apiGet(pin)); setPin(pin); }
    catch (ex) { return fail(isPinErr(ex) ? 'Codice reparto errato.' : 'Per il primo accesso serve la connessione: riprova quando c\'è rete.'); }
  }
  let t = findTecnico(n, c);
  if (!t && !MOCK) { btn.disabled = true; btn.textContent = 'Verifica…'; await refresh(); t = findTecnico(n, c); }
  btn.disabled = false; btn.textContent = 'Entra';
  if (!t) { err.textContent = 'Non trovo "' + n.trim() + ' ' + c.trim() + '" tra i manutentori abilitati. Controlla come è scritto o chiedi al responsabile di aggiungerti.'; err.hidden = false; return; }
  const sess = { man: t, exp: Date.now() + SESSION_H * 3600e3 };
  try { sessionStorage.setItem('pf_sess', JSON.stringify(sess)); } catch {}
  save('sess', sess);
  S.man = t; $('#login').hidden = true; render(); toast('Ciao ' + t);
  if (PENDING_EQ) { const e2 = PENDING_EQ; PENDING_EQ = null; afterScan(e2); }
  sync();
};
function logout() { try { sessionStorage.removeItem('pf_sess'); } catch {} save('sess', null); closeSh(); showLogin(); }
function needMan(next) { if (S.man) next(); else showLogin(); }
$('#manbtn').onclick = () => {
  sheet(`<div class="sheet-h"><h3>${esc(S.man)}</h3><button class="x" data-x aria-label="Chiudi">✕</button></div>
    <p class="hint">Fermi, soluzioni e anomalie vengono registrati a tuo nome. Se il telefono passa a un collega, esci.</p>
    <a class="submit blue" href="qr.html" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;margin-bottom:10px">${I.qr.replace('<svg', '<svg width="22" height="22"')}Stampa etichette QR</a>
    <button class="submit red" id="logout">Esci</button>`);
  $('#logout').onclick = logout;
};

function pickSheet(cb) {
  const linee = [...new Set(S.equipment.map(e => e.linea))];
  let L = null;
  const draw = () => {
    sheet(`<div class="sheet-h"><h3>Scegli macchina</h3><button class="x" data-x aria-label="Chiudi">✕</button></div>
      <div class="group"><span class="label">Linea</span><div class="chips big" id="pl">${chips(linee, L)}</div></div>
      ${L ? `<div class="group"><span class="label">Macchina</span><div class="list" id="pm">${S.equipment.filter(e => e.linea === L).map(e =>
        `<button class="chip" data-v="${esc(e.code)}"><b>${esc(e.macchina)}</b> <span class="label">· ${esc(e.code)}</span></button>`).join('')}</div></div>` : ''}`);
    $('#pl').onclick = e => { const b = e.target.closest('[data-v]'); if (b) { L = b.dataset.v; draw(); } };
    const pm = $('#pm'); if (pm) pm.onclick = e => { const b = e.target.closest('[data-v]'); if (b) { closeSh(); cb(eqBy(b.dataset.v)); } };
  };
  draw();
}

/* ================= Fermi: apertura e chiusura ================= */
const OFFSETS = [0, 5, 10, 15, 30];
const LOTTO_OK = v => /^\d{4,10}$/.test(String(v || '').trim());
const LOTTO_MSG = 'Il numero di lotto è obbligatorio (solo cifre): senza lotto il fermo non si può registrare.';
function openSheet(eq) {
  const O = { offset: 0 };
  const lotto = lastLotto(eq.linea);
  sheet(`<div class="sheet-h"><div><h3>Apri fermo</h3><div class="label" style="margin-top:4px">${esc(eq.linea)} · ${esc(eq.macchina)}</div></div><button class="x" data-x aria-label="Annulla">✕</button></div>
    <div class="group"><label class="label" for="lotto">Lotto</label><input class="field" id="lotto" inputmode="numeric" autocomplete="off" value="${esc(lotto)}" placeholder="Numero lotto in produzione">
      ${lotto ? '<div class="hint">Preso dall\'ultimo fermo su ' + esc(eq.linea) + ': controlla che sia ancora quello.</div>' : ''}</div>
    <div class="group"><span class="label">Inizio fermo</span><div class="chips" id="offs">${OFFSETS.map(o => `<button class="chip" type="button" data-v="${o}" aria-pressed="${o === 0}">${o ? '−' + o + ' min' : 'Adesso'}</button>`).join('')}</div></div>
    <div class="hint" style="margin-top:12px">Manutentore: <b>${esc(S.man)}</b></div>
    <div class="err" id="oerr" hidden></div>
    <button class="submit red" id="go">Apri fermo</button>`);
  singleChoice($('#offs'), v => O.offset = +v);
  $('#go').onclick = () => {
    const lv = $('#lotto').value.trim();
    if (!LOTTO_OK(lv)) { const e = $('#oerr'); e.textContent = LOTTO_MSG; e.hidden = false; $('#lotto').focus(); return; }
    const ts = Date.now() - O.offset * 60000;
    enqueue({ action: 'open', id: uid(), code: eq.code, linea: eq.linea, macchina: eq.macchina, lotto: lv, ts, turno: turnoOf(ts), manutentore: S.man, foto: '' });
    closeSh(); toast('Fermo aperto · ' + eq.linea + ' · ' + eq.macchina);
  };
}
function guastiFor(eq) {
  const G = S.guasti || {};
  if (!Object.keys(G).length) return S.liste[eq.area === 'Sterile' ? 'Guasto Sterile' : 'Guasto Secondario'] || ['ALTRO'];
  const all = [...(G[U(eq.code)] || []), ...(G[U(eq.linea)] || []), ...(G['TUTTE'] || [])];
  const seen = new Set(), out = [];
  for (const g of all) { const k = U(g); if (!seen.has(k)) { seen.add(k); out.push(g); } }
  const i = out.findIndex(g => U(g) === 'ALTRO'); if (i >= 0) out.push(out.splice(i, 1)[0]); else out.push('ALTRO');
  return out;
}
function closeSheet(f) {
  const eq = eqBy(f.code) || { area: 'Secondario', code: f.code, linea: f.linea };
  const C = { img: null, circles: [], cat: null, int: null, guasto: null };
  sheet(`<div class="sheet-h"><div><h3>Chiudi fermo</h3><div class="label" style="margin-top:4px">${esc(f.linea)} · ${esc(f.macchina)} · <span class="timer" style="font-size:13px" data-since="${f.start}">${fmtTimer(Date.now() - f.start)}</span></div></div><button class="x" data-x aria-label="Annulla">✕</button></div>
    <div class="group" id="phgrp"></div>
    <div class="group"><span class="label">Categoria</span><div class="chips" id="cat">${chips(S.liste['Categoria'] || [])}</div></div>
    <div class="group"><span class="label">Tipo intervento</span><div class="chips" id="int">${chips(S.liste['Tipo intervento'] || [])}</div></div>
    <div class="group"><span class="label">Tipo guasto</span><div class="chips" id="gua">${chips(guastiFor(eq))}</div></div>
    <div class="group"><label class="label" for="altro">Altro (descrizione breve)</label><textarea class="field" id="altro" placeholder="Cosa hai fatto. Per chiusure astucci: zona, lato macchina/OP, n° nonio"></textarea></div>
    <div class="group"><label class="label" for="clotto">Lotto</label><input class="field" id="clotto" inputmode="numeric" autocomplete="off" value="${esc(f.lotto && f.lotto !== 'undefined' ? f.lotto : '')}" placeholder="Numero lotto in produzione"></div>
    <div class="group"><label class="label" for="pezzo">Codice pezzo sostituito</label><input class="field" id="pezzo" autocomplete="off" placeholder="Facoltativo"></div>
    <div class="err" id="err" hidden></div>
    <button class="submit" id="go">Chiudi fermo</button>
    <div class="center" style="margin-top:8px"><button class="linkbtn danger" id="canc">Fermo aperto per errore? Annullalo</button></div>`);
  photoBox($('#phgrp'), C, 'Foto zona di intervento');
  singleChoice($('#cat'), v => C.cat = v);
  singleChoice($('#int'), v => C.int = v);
  singleChoice($('#gua'), v => C.guasto = v);
  $('#go').onclick = () => {
    const altro = $('#altro').value.trim();
    const miss = [!C.cat && 'categoria', !C.int && 'tipo intervento', !C.guasto && 'tipo guasto'].filter(Boolean);
    let msg = miss.length ? 'Manca: ' + miss.join(', ') + '.' : '';
    if (!msg && (C.guasto === 'ALTRO' || C.int === 'ALTRO') && !altro) msg = 'Hai scelto ALTRO: scrivi una descrizione breve.';
    if (!msg && !LOTTO_OK($('#clotto').value)) msg = LOTTO_MSG;
    if (msg) { const e = $('#err'); e.textContent = msg; e.hidden = false; return; }
    enqueue({ action: 'close', id: f.id, ts: Date.now(), manutentore: S.man, categoria: C.cat, intervento: C.int, guasto: C.guasto,
      altro, pezzo: $('#pezzo').value.trim(), lotto: $('#clotto').value.trim(), foto: C.img ? toJpeg(C.img, C.circles) : '' });
    closeSh(); toast('Fermo chiuso · ' + fmtDur((Date.now() - f.start) / 60000));
  };
  const cb = $('#canc');
  cb.onclick = () => {
    if (!cb.dataset.armed) { cb.dataset.armed = 1; cb.textContent = 'Tocca ancora per annullare il fermo'; return; }
    enqueue({ action: 'cancel', id: f.id }); closeSh(); toast('Fermo annullato');
  };
}

/* ================= Avvio ================= */
setInterval(() => {
  const n = Date.now();
  $$('[data-since]').forEach(e => e.textContent = fmtTimer(n - +e.dataset.since));
  const d = new Date(); $('#clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ' · turno ' + turnoOf(n);
}, 1000);
(function boot() {
  const c = load('cache', null);
  if (c) { S.equipment = c.equipment || S.equipment; S.liste = c.liste || S.liste; S.guasti = c.guasti || {}; S.fermi = c.fermi || [];
    S.soluzioni = c.soluzioni || []; S.documenti = c.documenti || []; S.anomalie = c.anomalie || []; }
  const url = new URL(location.href), eq = url.searchParams.get('eq'), h = url.hash.slice(1);
  if (['sol', 'doc', 'ano', 'anoform'].includes(h)) S.view = { name: h, code: eq || undefined };
  else if (eq) S.view = { name: 'equip', code: eq };
  S.man = getSession();
  render();
  // aperta dal QR con la fotocamera del telefono (…/?eq=CODICE): dopo l'accesso si va dritti al fermo
  const deep = eq && !h && eqBy(eq);
  if (!S.man) { PENDING_EQ = deep; showLogin(); } else if (deep) afterScan(deep);
  sync();
  setInterval(() => { if (!OUTBOX.length && document.visibilityState === 'visible') refresh(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(); });
  window.addEventListener('online', sync);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
