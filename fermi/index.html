<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#245a7a">
<title>Pharma-Fix</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Pharma-Fix">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#e9edf0; --surface:#ffffff; --surface2:#f3f6f8; --ink:#152028; --muted:#4d5b66; --line:#c9d2d9;
  --steel:#245a7a; --steel-ink:#ffffff; --steel-soft:#e3edf3; --amber:#c98600; --amber-ink:#6b4600; --amber-soft:#fff3d6;
  --ok:#2b8456; --ok-soft:#dff1e7; --crit:#c23b2a; --crit-soft:#fbe4e0; --yel:#f2cc1d; --yel-ink:#3d3100;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101519; --surface:#192127; --surface2:#1f2930; --ink:#e4ebef; --muted:#9aaab4; --line:#2e3a42;
  --steel:#5f9ec4; --steel-ink:#0d1418; --steel-soft:#1d3240; --amber:#f0b429; --amber-ink:#f6d48a; --amber-soft:#3a2f12;
  --ok:#4cb67f; --ok-soft:#173528; --crit:#e5654f; --crit-soft:#3d1e19; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
button,input,textarea{font:inherit;color:inherit}
button,a{cursor:pointer}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:center;gap:10px;padding-block:26px 6px} /* più spazio sotto la barra di stato (iOS sfuma il bordo alto) */
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand img{width:42px;height:42px;border-radius:10px;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.brand .wm{font:700 30px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;color:var(--ink)}
.brand .wm b{color:var(--crit);font-weight:700}
.brand small{display:block;font:500 11px/1.4 var(--mono);letter-spacing:.06em;color:var(--muted);margin-top:3px;text-transform:none}
.manbtn{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 12px;font-size:13px;font-weight:500;max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:flex;align-items:center;gap:6px;font:500 11px var(--mono);color:var(--muted);margin-bottom:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.dot.warn{background:var(--amber)}.dot.off{background:var(--crit)}.dot.demo{background:var(--muted)}
.updbar{display:block;width:100%;border:0;border-radius:var(--r);background:var(--steel);color:var(--steel-ink);font:600 14px var(--body);padding:12px;margin-block:6px;text-align:center}
.updbar[hidden]{display:none}
.tag.wait{background:var(--amber-soft);color:var(--amber-ink)}
.approw{display:flex;gap:8px;margin-top:6px}.appbtn{flex:1;border-radius:10px;padding:11px;font:600 15px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.appbtn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.appbtn.no{color:var(--crit)}.appbtn.no.armed{background:var(--crit);border-color:var(--crit);color:#fff}
.appban{display:flex;align-items:center;gap:8px;width:100%;text-align:left;cursor:pointer;font:inherit}.appban svg{width:20px;height:20px;flex:none}
.banner{background:var(--amber-soft);border:1px solid var(--amber);border-radius:var(--r);padding:10px 12px;font-size:13px;margin-block:6px;color:var(--amber-ink)}
h2{font:700 17px/1.2 var(--display);letter-spacing:.07em;text-transform:uppercase;margin:22px 0 10px;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline}
h2 .more{font:600 13px var(--body);letter-spacing:0;text-transform:none;color:var(--steel);background:none;border:0;padding:0}
.label{font:500 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.center{text-align:center}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.list{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:16px;color:var(--muted);text-align:center;font-size:14px}

/* Pulsante FERMO (home) */
.fermocard{display:flex;flex-direction:column;gap:10px;width:100%;border:0;background:var(--crit);color:#fff;border-radius:16px;padding:18px;text-align:left}
.fermocard .row{display:flex;align-items:center;gap:14px}
.fermocard .qr{width:58px;height:58px;border-radius:12px;background:#fff;color:#c23b2a;display:flex;align-items:center;justify-content:center;flex:none}
.fermocard .qr svg{width:36px;height:36px}
.fermocard .t1{font:700 32px/1 var(--display);letter-spacing:.04em}
.fermocard .t2{font:600 19px var(--display);letter-spacing:.04em;margin-top:4px}
.fermocard .steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;font-size:12px;font-weight:600}
.fermocard .steps span{background:#a32f20;border-radius:8px;padding:6px 4px;text-align:center}
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;min-height:44px;text-align:center}
.tile svg{width:22px;height:22px}
.tiles4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.tile4{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;min-height:64px}
.tile4 svg{width:22px;height:22px}.tile4 b{font:700 13px var(--display);letter-spacing:.04em}
.tile4 .n{position:absolute;top:5px;right:5px;font:500 11px var(--mono);background:var(--steel-soft);color:var(--steel);border-radius:9px;padding:0 6px;font-style:normal}
.bigbtn.ok{background:var(--ok);justify-content:space-between;padding-inline:20px}.bigbtn.ok .timer{font:500 22px var(--mono);color:#fff}
.h2r{float:right;font:400 12px var(--body);letter-spacing:0;text-transform:none;color:var(--muted);margin-top:6px}
.daysep{font:500 11px var(--mono);letter-spacing:.08em;color:var(--muted);margin:6px 0 -2px}
.icard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:4px;text-align:left;width:100%;color:inherit}
.icard .r1{display:flex;align-items:center;gap:8px}
.ore{font:500 13px var(--mono);color:var(--muted)}.ore.big{font-size:20px;color:var(--ink)}
.dur{margin-left:auto;font:500 14px var(--mono);background:var(--steel-soft);color:var(--steel);border-radius:6px;padding:2px 8px;white-space:nowrap}
.dur.long{background:var(--amber-soft);color:var(--amber-ink)}.dur.big{font:700 22px var(--display);padding:4px 10px}
.icard .t1{font-weight:600}.icard .ds{font-size:13px;color:var(--ink);opacity:.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.icard .ft{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}.icard .ft .ph{margin-left:auto;width:16px;height:16px;color:var(--steel)}
.icard .tag.d{font:500 10px var(--mono);background:var(--amber-soft);color:var(--amber-ink);border-radius:5px;padding:1px 6px}
.morebtn{width:100%;margin-top:10px;border:1px solid var(--steel);background:var(--surface);color:var(--steel);border-radius:10px;padding:12px;font:600 15px var(--body)}
.stats.grid2{grid-template-columns:repeat(2,minmax(0,1fr));margin-block:12px}
.tiles2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile2{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;display:flex;flex-direction:column;gap:6px;text-align:left;position:relative}
.tile2 svg{width:26px;height:26px}
.tile2 b{font:700 18px var(--display);letter-spacing:.03em}
.tile2 span{font-size:12px;color:var(--muted)}
.tile2 .n{position:absolute;top:10px;right:10px;font:500 12px var(--mono);background:var(--steel-soft);color:var(--steel);border-radius:10px;padding:1px 8px}

/* Fermi */
.ocard{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.ocard .bar{width:6px;align-self:stretch;background:var(--amber);border-radius:3px}
.ocard .what{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0}
.ocard .ln{font:700 19px/1.1 var(--display);letter-spacing:.03em}
.ocard .mc{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font:500 17px var(--mono);color:#9a6500;font-variant-numeric:tabular-nums}
@media (prefers-color-scheme:dark){.timer{color:var(--amber)}}
.closebtn{border:0;border-radius:10px;background:var(--ok);color:#fff;font:700 16px var(--display);letter-spacing:.06em;text-transform:uppercase;padding:14px}
.hrow{display:flex;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:100%;text-align:left;font:inherit;color:inherit}
button.hrow{cursor:pointer}button.hrow:active{background:var(--steel-soft)}
.hrow > div{min-width:0;flex:1}
.hrow .t1{font-weight:600;font-size:14px}
.hrow .t2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dur{font:500 14px var(--mono);font-variant-numeric:tabular-nums;text-align:right;flex:none!important}
.pend{font:500 10px var(--mono);color:var(--amber);display:block;text-align:right}

/* Scheda macchina */
.topline{display:flex;align-items:center;gap:10px;margin-top:4px}
.back{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none}
.back svg{width:20px;height:20px}
.code{font:500 13px var(--mono);color:var(--muted)}
.ptitle{font:700 24px/1 var(--display);text-transform:uppercase}
.eqtitle h1{margin:12px 0 2px;font:700 36px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;overflow-wrap:anywhere}
.fermobanner{display:flex;align-items:center;gap:10px;background:var(--amber-soft);border:1px solid var(--amber);border-radius:var(--r);padding:10px 12px;margin-top:14px;color:var(--amber-ink)}
.fermobanner .timer{font-size:20px;color:inherit}
.bigbtn.hero{flex-direction:column;gap:6px;min-height:46vh;max-height:330px;padding:22px 16px;border-radius:18px;box-shadow:0 6px 18px rgba(194,59,42,.28)}
.bigbtn.hero .bt{font:700 44px/1 var(--display);letter-spacing:.05em}
.bigbtn.hero .bs{font:500 15px/1.2 var(--body);letter-spacing:0;text-transform:none;opacity:.92}
.bigbtn.hero.ok{justify-content:center;padding-inline:16px;min-height:28vh;box-shadow:0 6px 18px rgba(31,122,77,.28)}.bigbtn.hero.ok .timer{font:600 40px var(--mono)}
.bigbtn.hero.home{min-height:30vh;margin-top:6px}
.bigbtn.hero.busy{background:#5a6873;box-shadow:none;cursor:default;min-height:24vh}.bigbtn.hero.busy .bt{font-size:34px}.bigbtn.hero.busy .timer{font:600 34px var(--mono);color:#fff}
.step.locked{opacity:.38;pointer-events:none;filter:grayscale(.6)}.step .lockhint{font-style:normal;text-transform:none;letter-spacing:0;font-weight:500}.step:not(.locked) .lockhint{display:none}
.stepn{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--steel);color:#fff;font:700 12px var(--body);font-style:normal;margin-right:7px;vertical-align:1px}
.bigbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;border:0;border-radius:14px;background:var(--crit);color:#fff;font:700 24px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;padding:20px 16px;margin-top:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-block:14px}
.stat{background:var(--surface);padding:10px}
.stat .v{font:700 24px/1.1 var(--display);margin-top:3px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat .v.sm{font-size:16px;line-height:1.5}

/* Urgenza */
.urg{display:inline-flex;align-items:center;font:700 12px var(--display);letter-spacing:.05em;border-radius:6px;padding:3px 8px;white-space:nowrap}
.u1{background:var(--crit);color:#fff}.u2{background:var(--yel);color:var(--yel-ink)}.u3{background:var(--ok);color:#fff}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px}.times label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.qrbtn{display:flex;align-items:center;gap:6px;border:0;border-radius:10px;background:var(--steel);color:var(--steel-ink);font:700 15px var(--display);letter-spacing:.06em;padding:10px 12px;min-height:44px;flex:none}
.qrbtn svg{width:20px;height:20px}
.urgpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.urgpick button{border:3px solid transparent;border-radius:10px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.urgpick button b{font:700 26px/1 var(--display)}
.urgpick button span{font:700 14px var(--display);letter-spacing:.02em;max-width:100%;overflow:hidden;text-overflow:ellipsis}
@media (max-width:400px){.urgpick button span{font-size:12.5px;letter-spacing:0}}
.urgpick button[aria-pressed="true"] b::after{content:" \2713";font-size:20px}
.urgpick button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px #fff}
.acard{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;width:100%;text-align:left}
.acard > div{flex:1;min-width:0}
.acard .t1{font-weight:600;font-size:14px}
.acard .t2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .age{font-size:12px;color:var(--muted);flex:none}

/* Soluzioni e documenti */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:46px;margin-top:12px}
.search input{border:0;outline:0;flex:1;background:transparent;font-size:16px;min-width:0}
.search svg{width:18px;height:18px;flex:none;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px;text-align:left}
.chip[aria-pressed="true"]{background:var(--steel);border-color:var(--steel);color:var(--steel-ink)}
.chips.big .chip{font:700 18px var(--display);letter-spacing:.04em;min-width:76px;text-align:center;min-height:44px}
.filters{margin-top:10px}
.provaprima{margin-top:12px;background:var(--surface);border:1px solid var(--steel);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.pp-h{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;color:var(--steel)}.pp-h svg{width:18px;height:18px}.pp-h b{font:700 17px var(--display);letter-spacing:.04em;text-transform:uppercase}.pp-h span{flex-basis:100%;font-size:12px;color:var(--muted)}
#pg .chip.extra{display:none}#pg.all .chip.extra{display:inline-flex}.chip.ghost{border-style:dashed;color:var(--steel)}.chip.ghost[aria-pressed="true"]{color:var(--steel-ink);border-style:solid}
.chip .cnt{font:500 11px var(--mono);opacity:.75;margin-left:4px}
.provaprima .sugg{margin-top:0;background:none;border:0;padding:0}.provaprima .sugg-i{border:1px solid var(--line);background:var(--surface2)}
.sugg{margin-top:10px;background:var(--steel-soft);border:1px solid var(--steel);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.sugg-h{display:flex;align-items:center;gap:8px;color:var(--steel);font-size:14px}.sugg-h svg{width:18px;height:18px}
.sugg-i{background:var(--surface);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:3px}.sugg-i .prob{font-weight:600;font-size:14px}.sugg-i .sol{font-size:14px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.scard .tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font:500 11px var(--mono);border-radius:6px;padding:3px 7px}
.tag.g{background:var(--steel-soft);color:var(--steel)}
.tag.v{background:var(--ok-soft);color:var(--ok)}
.tag.f{background:var(--amber-soft);color:var(--amber-ink)}
.scard .meta{margin-left:auto;font-size:12px;color:var(--muted)}
.scard .prob{font-weight:600}
.scard .sol{background:var(--surface2);border-radius:8px;padding:8px 10px;font-size:14px;white-space:pre-line}
.scard .ric{display:flex;gap:6px;flex-wrap:wrap}
.scard .ric span{font:500 12px var(--mono);border:1px solid var(--line);border-radius:6px;padding:3px 7px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:12px}
.seg button{border:0;background:none;padding:12px 6px;font:700 16px var(--display);letter-spacing:.05em}
.seg button[aria-pressed="true"]{background:var(--steel);color:var(--steel-ink)}
.drow{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-decoration:none;color:inherit}
.drow .ico{width:44px;height:52px;border-radius:6px;background:var(--crit-soft);color:var(--crit);display:flex;align-items:center;justify-content:center;font:500 11px var(--mono);flex:none}
.drow .ico.s{background:var(--steel-soft);color:var(--steel)}
.drow > div{flex:1;min-width:0}
.drow .t1{font-weight:600}
.drow .t2{font-size:12px;color:var(--muted)}
.drow svg{width:20px;height:20px;color:var(--steel);flex:none}
.addbtn{width:100%;border:0;border-radius:12px;background:var(--steel);color:var(--steel-ink);padding:16px;font:700 20px var(--display);letter-spacing:.06em;text-transform:uppercase;margin-top:14px}
.ctxbar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-top:12px}
.ctxbar > div{flex:1;min-width:0}
.ctxbar .t1{font-weight:600}
.linkbtn{background:none;border:0;color:var(--steel);font-weight:600;padding:10px 0;text-decoration:underline;text-underline-offset:3px}
.danger{color:var(--crit)}
/* Turni */
.tcode{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:30px;border-radius:7px;font:700 16px var(--display);flex:none;padding:0 6px}
.tc1{background:#f9d3d6;color:#9b1c25}.tc2{background:#fbeaa0;color:#6b4600}.tc3{background:#bcd9f0;color:#123f66}.tcG{background:#f5b443;color:#5a3300}
.tcR{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}.tcF,.tcA{background:#fff16a;color:#b3261e}.tcC{background:#6c35a0;color:#fff}.tcX{background:var(--surface2);color:var(--ink)}
.trow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.trow.today{border-color:var(--steel);box-shadow:inset 0 0 0 1px var(--steel)}.trow .dd{width:74px;flex:none;font:500 13px var(--mono);color:var(--muted)}.trow.today .dd{color:var(--steel);font-weight:600}
.trow .tl{flex:1;min-width:0;font-weight:600;font-size:14px}.trow .tl small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.chig{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-top:8px}
.chig .hd{display:flex;align-items:center;gap:8px;font:700 15px var(--display);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}.chig .hd span.n{margin-left:auto;font:500 12px var(--mono);color:var(--muted)}
.chig .nm{display:flex;flex-wrap:wrap;gap:6px}.chig .nm span{font-size:13px;background:var(--surface2);border-radius:6px;padding:3px 8px}.chig .nm span.me{background:var(--steel);color:var(--steel-ink)}
.chig .nm span i{font-style:normal;font-size:11px;color:var(--muted)}.chig .nm span.me i{color:inherit;opacity:.8}
/* Vestizione sterile (menu del nome) */
.vbox{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r);padding:12px;margin-top:8px;border:1px solid var(--line);background:var(--surface)}
.vbox svg{width:24px;height:24px;flex:none}.vbox b{display:block;font-size:15px}.vbox .hint{margin:2px 0 0}
.vbox.warn{background:var(--amber-soft);border-color:var(--amber);color:var(--amber-ink)}.vbox.warn .hint{color:var(--amber-ink)}
.vbox.exp{background:var(--crit-soft);border-color:var(--crit);color:var(--crit)}.vbox.exp .hint{color:var(--ink)}
.vbox.ok svg{color:var(--ok)}
/* Compiti (menu del nome) */
.manbtn{display:inline-flex;align-items:center;gap:6px}.manbtn .nm{overflow:hidden;text-overflow:ellipsis}
.kpill{flex:none;min-width:20px;height:20px;border-radius:10px;background:var(--crit);color:#fff;font:600 12px/20px var(--body);padding:0 6px;text-align:center}
.mbtn{display:flex;align-items:center;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;font:600 16px var(--body);color:var(--ink);text-align:left;text-decoration:none;margin-top:8px}
.mbtn svg{width:22px;height:22px;flex:none;color:var(--steel)}.mbtn .cnt{margin-left:auto;font:500 12px var(--mono);color:var(--muted)}.mbtn .cnt.r{color:var(--crit)}
.kcard{display:flex;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;width:100%;text-align:left;color:inherit}
.kcard .bar{width:5px;border-radius:3px;background:var(--steel);flex:none}.kcard.late .bar{background:var(--crit)}.kcard.kurg .bar{background:var(--yel)}.kcard.done .bar{background:var(--ok)}.kcard.ann .bar{background:var(--line)}
.kcard > div{flex:1;min-width:0}.kcard .r1{display:flex;align-items:center;gap:6px;font:500 12px var(--mono);color:var(--muted)}.kcard .r1 > span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kcard .r1 .tag{margin-left:auto;flex:none}
.kcard .t1{font-weight:600;margin-top:2px}.kcard .t2{font-size:12px;color:var(--muted)}
.tag.r{background:var(--crit-soft);color:var(--crit)}
.kbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;white-space:pre-line}
.kfacts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.kfacts > div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;overflow-wrap:anywhere}
.kstoria{font:500 12px/1.6 var(--mono);color:var(--muted);white-space:pre-line;margin-top:6px}
.person{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;text-align:left;color:inherit}.person b{flex:1;min-width:0}
.person[aria-pressed="true"]{border-color:var(--steel);box-shadow:inset 0 0 0 1px var(--steel)}

/* Barra in basso */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));max-width:640px;margin:0 auto}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font:700 12px var(--display);letter-spacing:.08em;padding:4px 0;min-height:44px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--steel)}

/* Fogli a comparsa */
.scrim{position:fixed;inset:0;overscroll-behavior:contain;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{overscroll-behavior:contain;background:var(--bg);width:100%;max-width:640px;max-height:94%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-h h3{margin:0;font:700 24px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.x{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:44px;height:44px;font-size:20px;line-height:1;flex:none}
.group{margin-top:16px}
.group > .label{display:block;margin-bottom:8px}
.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;font-size:16px}
textarea.field{min-height:64px;resize:vertical}
.err{color:var(--crit);font-size:13px;margin-top:8px}
.annot{border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#000;touch-action:manipulation}
.annot canvas{display:block;width:100%;height:auto}
.camtile{display:flex;align-items:center;gap:10px;border:1px dashed var(--steel);color:var(--steel);background:var(--surface);border-radius:10px;padding:14px;font-weight:600;width:100%}
.camtile svg{width:22px;height:22px}
.submit{width:100%;margin-top:20px;border:0;border-radius:12px;padding:18px;font:700 22px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--ok)}
.submit.red{background:var(--crit)}.submit.blue{background:var(--steel);color:var(--steel-ink)}
.scanner{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column}
.scanner video{flex:1;width:100%;object-fit:cover;min-height:0}
.scanner .frame{position:absolute;left:50%;top:42%;width:min(70vw,300px);aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.scanner .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:#000}
.scanner .bar button{background:#fff;color:#000;border:0;border-radius:10px;padding:12px 12px;font-weight:600}
.scanner .msg{position:absolute;left:0;right:0;top:calc(14px + env(safe-area-inset-top,0px));text-align:center;color:#fff;font-weight:600;text-shadow:0 1px 3px #000}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;font-weight:500;z-index:30;max-width:calc(100% - 32px)}
.login{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding:calc(32px + env(safe-area-inset-top,0px)) 16px 32px}
.login .in{max-width:420px;margin:0 auto}
.login h1{font:700 40px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0}
.login p{color:var(--muted)}
.login label{display:block;margin-top:16px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><img src="icon-192.png" alt=""><div><div class="wm">Pharma-<b>Fix</b></div><small id="clock">—</small></div></div>
    <button class="manbtn" id="manbtn">—</button>
  </header>
  <div class="sync" id="sync"><span class="dot demo"></span><span>…</span></div>
  <button class="updbar" id="upd" hidden onclick="location.reload()">Nuova versione dell'app · tocca per aggiornare</button>
  <div id="banner"></div>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Sezioni"><div class="in">
  <button data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg>HOME</button>
  <button data-nav="sol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M14 6a4 4 0 0 0-5 5l-5 5 3 3 5-5a4 4 0 0 0 5-5l-2.5 2.5-2.5-.5-.5-2.5z"/></svg>SOLUZIONI</button>
  <button data-nav="doc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/></svg>DOCUMENTI</button>
  <button data-nav="ano"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg>ANOMALIE</button>
</div></nav>
<div id="sheet"></div>
<div id="login" class="login" hidden><div class="in">
  <h1>Pharma-Fix</h1><div class="label" style="margin-top:6px">Manutenzione · accesso tecnico</div>
  <p>Inserisci nome e cognome. Devono essere nell'elenco dei manutentori abilitati.</p>
  <form id="lform" novalidate>
    <div id="pinwrap"><label class="label" for="lpin">Codice reparto</label><input class="field" id="lpin" type="password" autocomplete="off" inputmode="text">
      <div class="hint">Lo chiedi al responsabile. Serve solo la prima volta su questo telefono.</div></div>
    <label class="label" for="lnome">Nome</label><input class="field" id="lnome" autocomplete="given-name" autocapitalize="words" required>
    <label class="label" for="lcogn">Cognome</label><input class="field" id="lcogn" autocomplete="family-name" autocapitalize="words" required>
    <div class="err" id="lerr" hidden></div>
    <button class="submit" type="submit" id="lgo">Entra</button>
  </form>
</div></div>
<div id="scanwrap"></div>
<input id="cam" type="file" accept="image/*" capture="environment" hidden>
<input id="fileup" type="file" accept="image/*,application/pdf" hidden>

<script src="config.js"></script>
<script src="defaults.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" defer></script>
<script>
'use strict';
/* ================= Config & stato ================= */
const CFG = window.PF_CONFIG || {};
const MOCK = !CFG.API_URL;
const S = { equipment: PF_DEFAULTS.equipment, liste: PF_DEFAULTS.liste, guasti: {}, fermi: [], soluzioni: [], documenti: [], anomalie: [], compiti: [], vestizioni: [], turni: {},
  loaded: false, view: { name: 'home' }, man: '', net: 'ok', lastSync: 0 };
let PENDING_EQ = null;
const SESSION_H = 9; // dopo 9 ore (un turno) si rifà l'accesso
let OUTBOX = load('outbox', []);
// Identificativo di questo telefono: ogni tecnico è legato al suo telefono (foglio Telefoni)
const DEV = load('dev', '') || (() => { const d = 'T-' + Math.random().toString(36).slice(2, 6).toUpperCase() + Date.now().toString(36).slice(-4).toUpperCase(); save('dev', d); return d; })();
const DEV_NAME = (() => { const u = navigator.userAgent; const m = u.match(/\(([^)]+)\)/); const parts = m ? m[1].split(';').map(x => x.trim()) : [];
  const model = parts.find(x => /Build|SM-|Pixel|Redmi|iPhone|iPad|moto|Nokia|OnePlus|HUAWEI|Xiaomi/i.test(x)) || parts[parts.length - 1] || '';
  return ((/Android/.test(u) ? 'Android ' : /iPhone|iPad/.test(u) ? 'iOS ' : '') + model.replace(/Build.*/, '')).trim().slice(0, 60); })();
const isTelErr = e => /Telefono non/.test(e && e.message || '');

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
function load(k, d) { try { const v = localStorage.getItem('pf_' + k); return v == null ? d : JSON.parse(v); } catch { return d; } }
function save(k, v) { try { localStorage.setItem('pf_' + k, JSON.stringify(v)); return true; } catch { return false; } }
function fmtDur(min) { min = Math.round(min); if (min < 60) return min + '′'; const h = Math.floor(min / 60), m = min % 60; return h + 'h' + (m ? ' ' + pad(m) + '′' : ''); }
function fmtTimer(ms) { const s = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' : '') + pad(m) + ':' + pad(x); }
function fmtDT(t) { const d = new Date(t); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function fmtD(t) { const d = new Date(t); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1); }
function age(t) { if (!t) return ''; const m = (Date.now() - t) / 60000; if (m < 60) return Math.max(1, Math.round(m)) + ' min fa'; if (m < 1440) return Math.round(m / 60) + ' h fa'; const g = Math.round(m / 1440); return g === 1 ? 'ieri' : g + ' gg fa'; }
function turnoOf(t) { const h = new Date(t).getHours(); return h >= 6 && h < 14 ? 'T1' : h >= 14 && h < 22 ? 'T2' : 'T3'; }
function uid(p = 'F') { return p + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 6).toUpperCase(); }
function toast(msg, ms = 2800) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), ms); }
const U = s => String(s || '').trim().toUpperCase();
// Aree: FILLING (sterile, telefono non ammesso: fermo registrato all'uscita) e PACKAGING
const isFill = eq => !!eq && /^(FILL|STERIL)/i.test(String(eq.area || '').trim());
const areaLbl = a => /^(FILL|STERIL)/i.test(String(a || '').trim()) ? 'FILLING' : /^(PACK|SECOND)/i.test(String(a || '').trim()) ? 'PACKAGING' : U(a);
const eqBy = code => S.equipment.find(e => U(e.code) === U(code));
const nice = s => String(s || '').toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());
const I = {
  qr: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 18h2v2h-2zM14 18h2M18 14h2"/></svg>',
  cam: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h3l2-3h8l2 3h3v11H3z"/><circle cx="12" cy="13" r="4"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  sol: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--steel)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M14 6a4 4 0 0 0-5 5l-5 5 3 3 5-5a4 4 0 0 0 5-5l-2.5 2.5-2.5-.5-.5-2.5z"/></svg>',
  doc: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--steel)" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg>',
  sch: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--steel)" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v14H4zM4 10h16M10 10v9"/></svg>',
  ano: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--crit)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg>',
  open: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg>'
};
const URG = { 1: 'CRITICO', 2: 'URGENTE', 3: 'PROGRAMMABILE' };
const urgTag = u => `<span class="urg u${u}">${u} · ${URG[u] || ''}</span>`;

/* ================= Dati: server + coda locale ================= */
function allFermi() {
  const m = new Map(S.fermi.map(f => [f.id, { ...f }]));
  for (const op of OUTBOX) {
    if (op.action === 'open' && !m.has(op.id)) {
      m.set(op.id, { id: op.id, code: op.code, linea: op.linea, macchina: op.macchina, lotto: op.lotto, start: op.ts, stato: 'APERTO', man: op.manutentore, apertoDa: op.manutentore, pending: true });
    } else if (op.action === 'close' && m.has(op.id)) {
      Object.assign(m.get(op.id), { stato: 'CHIUSO', end: op.ts, ...(op.inizio ? { start: op.inizio } : {}), ...(op.dichiarato ? { orari: 'DICHIARATI' } : {}), lotto: op.lotto || m.get(op.id).lotto, cat: op.categoria, int: op.intervento, guasto: op.guasto, altro: op.altro, man: op.manutentore, pending: true });
    } else if (op.action === 'cancel') m.delete(op.id);
  }
  return [...m.values()].sort((a, b) => b.start - a.start);
}
// Coordinatori (colonna del foglio Liste): approvano le soluzioni nuove dei tecnici
const isCoord = (nome = S.man) => !!nome && Object.keys(S.liste).filter(k => /^\s*coordinator[ei]\s*$/i.test(k)).some(k => (S.liste[k] || []).some(c => U(c) === U(nome)));
// Il fermo lo chiude (o annulla) solo chi l'ha aperto; i coordinatori possono chiudere tutti
const apertoDa = f => String(f.apertoDa || f.man || '');
const canClose = f => !!S.man && (U(apertoDa(f)) === U(S.man) || isCoord());
function allSoluzioni() {
  const out = S.soluzioni.map(s => ({ ...s, stato: s.stato || 'VERIFICATA' }));
  for (const op of OUTBOX) {
    if (op.action === 'soluzione' && !out.some(s => s.id === op.id)) {
      const e = eqBy(op.code) || {};
      out.push({ id: op.id, ts: op.ts, dove: op.code || op.linea || 'TUTTE', linea: e.linea || op.linea || '', macchina: e.macchina || '', guasto: op.guasto, problema: op.problema, soluzione: op.soluzione, ricambi: op.ricambi, link: '', autore: op.manutentore, pending: true,
        stato: isCoord(op.manutentore) ? 'VERIFICATA' : 'DA APPROVARE' });
    } else if (op.action === 'approvaSol') { const s = out.find(x => x.id === op.id); if (s) s.stato = op.esito === 'NO' ? 'SCARTATA' : 'VERIFICATA'; }
  }
  return out.filter(s => s.stato !== 'SCARTATA');
}
const solVerificate = () => allSoluzioni().filter(s => s.stato === 'VERIFICATA');
const solDaApprovare = () => allSoluzioni().filter(s => s.stato === 'DA APPROVARE');
function allAnomalie() {
  const m = new Map(S.anomalie.map(a => [a.id, { ...a }]));
  for (const op of OUTBOX) {
    if (op.action === 'anomalia' && !m.has(op.id)) {
      const e = eqBy(op.code) || {};
      m.set(op.id, { id: op.id, ts: op.ts, code: op.code, linea: e.linea, macchina: e.macchina, urgenza: op.urgenza, descr: op.descr, serve: op.serve, da: op.manutentore, stato: 'APERTA', pending: true });
    } else if (op.action === 'anomaliaStato' && m.has(op.id)) Object.assign(m.get(op.id), { stato: op.stato, gestita: op.manutentore, note: op.note || m.get(op.id).note, chiusa: op.stato === 'CHIUSA' ? op.ts : null, pending: true });
  }
  return [...m.values()];
}
// Compiti: assegnati dal coordinatore a un tecnico o a un turno ("Turno T2")
function allCompiti() {
  const m = new Map(S.compiti.map(k => [k.id, { ...k }]));
  for (const op of OUTBOX) {
    if (op.action === 'compito' && !m.has(op.id)) {
      const e = eqBy(op.code) || {};
      m.set(op.id, { id: op.id, ts: op.ts, da: op.manutentore, a: op.a, code: op.code || '', linea: e.linea || '', titolo: op.titolo, descr: op.descr, pr: op.pr, entro: op.entroTs, stato: 'DA FARE', storia: '', pending: true });
    } else if (op.action === 'compitoStato' && m.has(op.id)) {
      const k = m.get(op.id), st = op.stato; k.pending = true;
      if (st === 'IN CORSO') Object.assign(k, { stato: st, presoDa: op.manutentore, preso: op.ts });
      else if (st === 'FATTO') Object.assign(k, { stato: st, presoDa: k.presoDa || op.manutentore, fattoDa: op.manutentore, fatto: op.ts, nota: op.nota });
      else if (st === 'DA FARE') Object.assign(k, { stato: st, presoDa: '', preso: null, fattoDa: '', fatto: null });
      else k.stato = st;
    }
  }
  return [...m.values()];
}

const GIORNI = ['DOMENICA', 'LUNEDÌ', 'MARTEDÌ', 'MERCOLEDÌ', 'GIOVEDÌ', 'VENERDÌ', 'SABATO'];

// Soluzioni verificate più adatte al guasto scelto: stesso tipo guasto, oppure parole del guasto nel testo
const STOP = new Set(['DELLA', 'DELLE', 'DEGLI', 'ALTRO', 'MACCHINA', 'REGOLAZIONE', 'REGOLARE', 'SOSTITUZIONE', 'PULIZIA', 'RIAVVIO', 'CONTROLLO']);
function suggerite(eq, guasto, max = 3) {
  const g = U(guasto); if (!g || g === 'ALTRO') return [];
  const words = g.replace(/[^A-Z0-9À-Ù ]/g, ' ').split(/\s+/).filter(w => w.length >= 4 && !STOP.has(w));
  return solVerificate().filter(s => vale(s.dove, eq)).map(s => {
    const prob = U(s.problema), resto = U([s.soluzione, s.ricambi].join(' '));
    let sc = U(s.guasto) === g ? 10 : 0;
    for (const w of words) { // inizio di parola: ASTUCCI/ASTUCCIO, ISTRUZIONI/ISTRUZIONE; conta di più se è nel problema
      const re = new RegExp('(^|[^A-Z0-9À-Ù])' + w.slice(0, Math.max(4, w.length - 2)));
      if (re.test(prob)) sc += 3; else if (re.test(resto)) sc += 1;
    }
    if (sc && U(s.dove) === U(eq.code)) sc += 1; // prima quelle di questa macchina
    return { s, sc };
  }).filter(x => x.sc > 0).sort((a, b) => b.sc - a.sc || (b.s.ts || 0) - (a.s.ts || 0)).slice(0, max).map(x => x.s);
}

function provaPrima(eq, open, hist) {

  const gl = guastiFor(eq).filter(g => U(g) !== 'ALTRO').map((g, i) => ({ g, n: cnt[U(g)] || 0, i })).sort((a, b) => b.n - a.n || a.i - b.i);
  if (!gl.length) return '';
  const sel = PRE_G[open.id] || (gl[0].n ? gl[0].g : '');
  return `<div class="provaprima"><div class="pp-h">${I.sol}<b>Cosa provare</b><span>scegli il guasto: le soluzioni verificate per questa macchina</span></div>
    <div class="chips" id="pg">${gl.map((x, i) => `<button class="chip${i >= 6 && x.g !== sel ? ' extra' : ''}" type="button" data-v="${esc(x.g)}" aria-pressed="${x.g === sel}">${esc(x.g.split(',')[0])}${x.n ? ` <span class="cnt">${x.n}</span>` : ''}</button>`).join('')}${gl.length > 6 ? `<button class="chip ghost" type="button" data-more>+ altri ${gl.length - 6}</button>` : ''}</div>

// Con un foglio a mezza pagina aperto la pagina dietro resta ferma (anche su iPhone, dove overflow:hidden non basta)
let LOCK_Y = null;
function lockBg(on) {
  const b = document.body;
  if (on && LOCK_Y === null) { LOCK_Y = window.scrollY; Object.assign(b.style, { position: 'fixed', top: -LOCK_Y + 'px', left: '0', right: '0', width: '100%' }); }
  else if (!on && LOCK_Y !== null) { const y = LOCK_Y; LOCK_Y = null; Object.assign(b.style, { position: '', top: '', left: '', right: '', width: '' }); window.scrollTo(0, y); }
}

/* ---- Accesso: nome + cognome verificati sull'elenco Manutentori ---- */
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z' ]/g, ' ').replace(/\s+/g, ' ').trim();
function findTecnico(nome, cognome) {
  const want = (norm(nome) + ' ' + norm(cognome)).split(' ').filter(Boolean).sort().join(' ');
  return (S.liste['Manutentori'] || []).find(m => norm(m).split(' ').sort().join(' ') === want) || null;
}
function getSession() {
  let s = null; try { s = JSON.parse(sessionStorage.getItem('pf_sess') || 'null'); } catch {}
  if (!s) s = load('sess', null);
  return s && s.exp > Date.now() && (S.liste['Manutentori'] || []).includes(s.man) ? s.man : '';
}
function showLogin() {
  S.man = ''; renderHeader(); $('#login').hidden = false;
  $('#pinwrap').hidden = MOCK || !!getPin(); $('#lpin').value = '';
  $('#lerr').hidden = true; $('#lnome').value = ''; $('#lcogn').value = '';

$('#lform').onsubmit = async e => {
  e.preventDefault();
  const n = $('#lnome').value, c = $('#lcogn').value, err = $('#lerr'), btn = $('#lgo');
  const fail = msg => { err.textContent = msg; err.hidden = false; btn.disabled = false; btn.textContent = 'Entra'; };
  if (!norm(n) || !norm(c)) return fail('Scrivi sia il nome sia il cognome.');
  if (!MOCK && !getPin()) {
    const pin = $('#lpin').value.trim();
    if (!pin) return fail('Inserisci il codice reparto.');
    btn.disabled = true; btn.textContent = 'Verifica…';
    try { applyInit(await apiGet(pin)); setPin(pin); }
    catch (ex) { return fail(isPinErr(ex) ? 'Codice reparto errato.' : 'Per il primo accesso serve la connessione: riprova quando c\'è rete.'); }
  }
  let t = findTecnico(n, c);
  if (!t && !MOCK) { btn.disabled = true; btn.textContent = 'Verifica…'; await refresh(); t = findTecnico(n, c); }
  btn.disabled = false; btn.textContent = 'Entra';
  if (!t) { err.textContent = 'Non trovo "' + n.trim() + ' ' + c.trim() + '" tra i manutentori abilitati. Controlla come è scritto o chiedi al responsabile di aggiungerti.'; err.hidden = false; return; }
  if (!MOCK) { // il nome deve essere quello del proprietario di questo telefono
    const okList = load('devok', []);
    btn.disabled = true; btn.textContent = 'Verifica…';
    try {
      const r = await fetch(CFG.API_URL + '?action=login&key=' + encodeURIComponent(getPin()) + '&man=' + encodeURIComponent(t) + '&dev=' + encodeURIComponent(DEV) + '&devName=' + encodeURIComponent(DEV_NAME));
      const j = await r.json();
      if (!j.ok) { if (isPinErr({ message: j.error })) { pinInvalid(); return; } return fail(j.error || 'Accesso non riuscito'); }
      if (!okList.includes(t)) save('devok', [...okList, t]);
    } catch { if (!okList.includes(t)) return fail('Primo accesso con questo nome su questo telefono: serve la connessione.'); }
    btn.disabled = false; btn.textContent = 'Entra';
  }
  const sess = { man: t, exp: Date.now() + SESSION_H * 3600e3 };
  try { sessionStorage.setItem('pf_sess', JSON.stringify(sess)); } catch {}
  save('sess', sess);
  S.man = t; $('#login').hidden = true; render(); toast('Ciao ' + t);
  if (PENDING_EQ) { const e2 = PENDING_EQ; PENDING_EQ = null; afterScan(e2); }

  $('#kok').onclick = () => needMan(() => {
    keep();
    const t = P.t.trim(), e = $('#ker');
    const msg = !P.a ? 'Scegli a chi assegnarlo.' : t.length < 4 ? 'Scrivi un titolo per il compito.' : !P.w ? 'Scegli entro quando.' : '';
    if (msg) { e.textContent = msg; e.hidden = false; return; }
    const [y, m, g] = P.w.split('-').map(Number);
    enqueue({ action: 'compito', id: uid('K'), a: P.a, titolo: t, descr: P.d.trim(), code: P.code, pr: P.pr, entro: P.w, entroTs: new Date(y, m - 1, g).getTime(), ts: Date.now(), manutentore: S.man });
    toast('Compito assegnato a ' + P.a, 3200); shReparto();
  });
}
function pickSheet(cb) {
  const linee = [...new Set(S.equipment.map(e => e.linea))];
  let L = null;
  const draw = () => {
    sheet(`<div class="sheet-h"><h3>Scegli macchina</h3><button class="x" data-x aria-label="Chiudi">✕</button></div>
      <div class="group"><span class="label">Linea</span><div class="chips big" id="pl">${chips(linee, L)}</div></div>
      ${L ? `<div class="group"><span class="label">Macchina</span><div class="list" id="pm">${S.equipment.filter(e => e.linea === L).map(e =>
        `<button class="chip" data-v="${esc(e.code)}"><b>${esc(e.macchina)}</b> <span class="label">· ${esc(e.code)}</span></button>`).join('')}</div></div>` : ''}`);
    $('#pl').onclick = e => { const b = e.target.closest('[data-v]'); if (b) { L = b.dataset.v; draw(); } };
    const pm = $('#pm'); if (pm) pm.onclick = e => { const b = e.target.closest('[data-v]'); if (b) { closeSh(); cb(eqBy(b.dataset.v)); } };
  };
  draw();
}

/* ================= Fermi: apertura e chiusura ================= */
const OFFSETS = [0]; // "Adesso"; per un inizio diverso c'è "Altro orario"
const LOTTO_OK = v => /^\d{4,10}$/.test(String(v || '').trim());
const LOTTO_MSG = 'Il numero di lotto è obbligatorio (solo cifre): senza lotto il fermo non si può registrare.';
function openSheet(eq) {
  const O = { offset: 0 };
  const lotto = lastLotto(eq.linea);
  sheet(`<div class="sheet-h"><div><h3>Apri fermo</h3><div class="label" style="margin-top:4px">${esc(eq.linea)} · ${esc(eq.macchina)}</div></div><button class="x" data-x aria-label="Annulla">✕</button></div>
    <div class="group"><label class="label" for="lotto">Lotto</label><input class="field" id="lotto" inputmode="numeric" autocomplete="off" value="${esc(lotto)}" placeholder="Numero lotto in produzione">
      ${lotto ? '<div class="hint">Preso dall\'ultimo fermo su ' + esc(eq.linea) + ': controlla che sia ancora quello.</div>' : ''}</div>
    <div class="group"><span class="label">Inizio fermo</span><div class="chips" id="offs">${OFFSETS.map(o => `<button class="chip" type="button" data-v="${o}" aria-pressed="${o === 0}">${o ? '−' + o + ' min' : 'Adesso'}</button>`).join('')}<button class="chip ghost" type="button" data-v="ora" aria-pressed="false">Altro orario</button></div>
      <div id="orawrap" hidden style="margin-top:10px"><input class="field" type="time" id="oraini"><div class="hint">Ora in cui la macchina si è fermata. L'inizio viene segnato come <b>dichiarato</b>.</div></div></div>
    <div class="hint" style="margin-top:12px">Manutentore: <b>${esc(S.man)}</b></div>
    <div class="err" id="oerr" hidden></div>
    <button class="submit red" id="go">Apri fermo</button>`);
  singleChoice($('#offs'), v => { O.offset = v === 'ora' ? 'ora' : +v; $('#orawrap').hidden = v !== 'ora'; if (v === 'ora') $('#oraini').focus(); });
  $('#go').onclick = () => {
    const lv = $('#lotto').value.trim(), e = $('#oerr'), now = Date.now();
    if (!LOTTO_OK(lv)) { e.textContent = LOTTO_MSG; e.hidden = false; $('#lotto').focus(); return; }
    let ts = now - (O.offset === 'ora' ? 0 : O.offset) * 60000, dich;
    if (O.offset === 'ora') { // inizio scritto a mano: nel turno in corso (o appena finito, entro 2 ore dal cambio turno)
      ts = oraToTs($('#oraini').value, now); const t0 = limiteDichiarati(now);
      const msg = ts == null ? 'Scrivi l\'ora di inizio del fermo.' : ts < t0 ? 'Si possono aprire solo fermi iniziati dalle ' + pad(new Date(t0).getHours()) + ':' + pad(new Date(t0).getMinutes()) + ' in poi.' : '';
      if (msg) { e.textContent = msg; e.hidden = false; return; }
      dich = true;
    }
    enqueue({ action: 'open', id: uid(), code: eq.code, linea: eq.linea, macchina: eq.macchina, lotto: lv, ts, turno: turnoOf(ts), manutentore: S.man, foto: '', dichiarato: dich });
    closeSh(); toast('Fermo aperto · ' + eq.linea + ' · ' + eq.macchina);
  };
}
function guastiFor(eq) {
  const G = S.guasti || {};
  if (!Object.keys(G).length) return S.liste[isFill(eq) ? 'Guasto Sterile' : 'Guasto Secondario'] || ['ALTRO'];
  const all = [...(G[U(eq.code)] || []), ...(G[U(eq.linea)] || []), ...(G['TUTTE'] || [])];
  const seen = new Set(), out = [];
  for (const g of all) { const k = U(g); if (!seen.has(k)) { seen.add(k); out.push(g); } }
  const i = out.findIndex(g => U(g) === 'ALTRO'); if (i >= 0) out.push(out.splice(i, 1)[0]); else out.push('ALTRO');
  return out;
}
// FILLING: in sterile il telefono non entra. All'uscita si scansiona/fotografa il QR e si registra il fermo
// con inizio e fine scritti a mano (gli stessi del batch record), solo dentro il turno in corso.
function inizioTurno(now = Date.now()) {
  const d = new Date(now), h = d.getHours(), s = new Date(d);
  s.setHours(h >= 6 && h < 14 ? 6 : h >= 14 && h < 22 ? 14 : 22, 0, 0, 0);
  if (h < 6) s.setDate(s.getDate() - 1);
  return s.getTime();
}
// Orari dal batch record: turno in corso, oppure quello appena finito se si registra entro 2 ore dal cambio turno
const TOLL_DICH = 120;
function limiteDichiarati(now = Date.now()) {
  let t = inizioTurno(now);
  if (now - t < TOLL_DICH * 60000) t = inizioTurno(t - 60000);
  return t;
}
function oraToTs(v, now = Date.now()) { // "HH:MM" → istante più recente non nel futuro
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(v || '').trim()); if (!m) return null;
  const d = new Date(now); d.setHours(+m[1], +m[2], 0, 0);
  if (d.getTime() > now + 60000) d.setDate(d.getDate() - 1);
  return d.getTime();
}
function fillSheet(eq) {
  closeSheet({ id: uid(), code: eq.code, linea: eq.linea, macchina: eq.macchina, lotto: lastLotto(eq.linea) }, { reg: true });
}
function closeSheet(f, opt = {}) {
  const eq = eqBy(f.code) || { area: 'Packaging', code: f.code, linea: f.linea };
  const C = { img: null, circles: [], cat: null, int: null, guasto: PRE_G[f.id] || null };
  const REG = !!opt.reg, FILL = !REG && isFill(eq), ORE = REG || FILL, t0 = limiteDichiarati();
  const hhmm = t => pad(new Date(t).getHours()) + ':' + pad(new Date(t).getMinutes());
  sheet(`<div class="sheet-h"><div><h3>${REG ? 'Registra fermo' : 'Chiudi fermo'}</h3><div class="label" style="margin-top:4px">${esc(f.linea)} · ${esc(f.macchina)}${REG ? ' · <b>' + esc(areaLbl(eq.area) || 'FERMO GIÀ FINITO') + '</b>' : ` · <span class="timer" style="font-size:13px" data-since="${f.start}">${fmtTimer(Date.now() - f.start)}</span>`}</div></div><button class="x" data-x aria-label="Annulla">✕</button></div>
    ${ORE ? `<div class="group"><span class="label">Orari del fermo${isFill(eq) ? ' · come sul batch record' : ''}</span>
      <div class="times"><label>Inizio<input class="field" type="time" id="tini" ${FILL ? `value="${hhmm(f.start)}"` : ''} required></label><label>Fine<input class="field" type="time" id="tfin" value="${hhmm(Date.now())}" required></label></div>
      <div class="hint">${FILL ? 'Già scritti: apertura e adesso. Correggili con gli orari del batch record. ' : REG && !isFill(eq) ? 'Fermo non aperto in tempo: scrivi quando la macchina si è fermata e quando è ripartita. ' : ''}Fermi dalle ${hhmm(t0)} in poi. Gli orari scritti a mano vengono segnati come <b>dichiarati</b>.</div></div>` : ''}
    <div class="group step" id="st1"><span class="label"><em class="stepn">1</em>Categoria</span><div class="chips" id="cat">${chips(S.liste['Categoria'] || [])}</div></div>
    <div class="group step locked" id="st2"><span class="label"><em class="stepn">2</em>Tipo intervento <i class="lockhint">· scegli prima la categoria</i></span><div class="chips" id="int">${chips(S.liste['Tipo intervento'] || [])}</div></div>
    <div class="group step locked" id="st3"><span class="label"><em class="stepn">3</em>Tipo guasto <i class="lockhint">· scegli prima il tipo intervento</i></span><div class="chips" id="gua">${chips(guastiFor(eq), C.guasto)}</div><div id="solsug"></div></div>
    <div class="step locked" id="st4">
      <div class="group"><label class="label" for="altro"><em class="stepn">4</em>Descrizione breve <i class="lockhint">· scegli prima il tipo guasto</i></label><textarea class="field" id="altro" placeholder="Cosa hai fatto. Per chiusure astucci: zona, lato macchina/OP, n° nonio"></textarea></div>
      <div class="group"><label class="label" for="clotto"><em class="stepn">5</em>Lotto</label><input class="field" id="clotto" inputmode="numeric" autocomplete="off" value="${esc(f.lotto && f.lotto !== 'undefined' ? f.lotto : '')}" placeholder="Numero lotto in produzione"></div>
      <div class="group" id="phgrp"></div>
      <div class="group" id="pzgrp" hidden><label class="label" for="pezzo">Codice pezzo sostituito · obbligatorio con SOSTITUZIONE</label><input class="field" id="pezzo" autocomplete="off" placeholder="Codice del ricambio montato"></div>
    </div>
    <div class="err" id="err" hidden></div>
    <button class="submit" id="go">${REG ? 'Registra fermo' : 'Chiudi fermo'}</button>
    ${REG ? '' : '<div class="center" style="margin-top:8px"><button class="linkbtn danger" id="canc">Fermo aperto per errore? Annullalo</button></div>'}`);
  photoBox($('#phgrp'), C, 'Foto zona di intervento');
  // passo dopo passo: categoria → tipo intervento → tipo guasto → descrizione e lotto
  const sblocca = id => { const el = $('#' + id); if (!el || !el.classList.contains('locked')) return; el.classList.remove('locked'); setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 60); };
  singleChoice($('#cat'), v => { C.cat = v; sblocca('st2'); });
  const sost = () => U(C.int) === 'SOSTITUZIONE';
  singleChoice($('#int'), v => { C.int = v; $('#pzgrp').hidden = !sost(); sblocca('st3'); if (C.guasto) sblocca('st4'); });
  singleChoice($('#gua'), v => { C.guasto = v; showSuggest(eq, v); sblocca('st4'); });
  if (C.guasto) showSuggest(eq, C.guasto);
  $('#go').onclick = () => {
    const altro = $('#altro').value.trim();
    const miss = [!C.cat && 'categoria', !C.int && 'tipo intervento', !C.guasto && 'tipo guasto'].filter(Boolean);
    let msg = miss.length ? 'Manca: ' + miss.join(', ') + '.' : '';
    if (!msg && (C.guasto === 'ALTRO' || C.int === 'ALTRO') && !altro) msg = 'Hai scelto ALTRO: scrivi una descrizione breve.';
    if (!msg && !LOTTO_OK($('#clotto').value)) msg = LOTTO_MSG;
    if (!msg && sost() && !$('#pezzo').value.trim()) { msg = 'Hai scelto SOSTITUZIONE: scrivi il codice del pezzo sostituito.'; $('#pezzo').focus(); }
    const now = Date.now();
    let ini = f.start, fin = now;
    let dich = REG;
    if (!msg && ORE) {
      ini = oraToTs($('#tini').value, now); fin = oraToTs($('#tfin').value, now);
      if (ini != null && fin != null && ini >= fin && fin - (ini - 864e5) <= 12 * 3600e3) ini -= 864e5; // fermo a cavallo della mezzanotte
      if (ini == null || fin == null) msg = 'Scrivi ora di inizio e di fine del fermo.';
      else if (fin < t0) msg = 'Si possono registrare solo fermi finiti dalle ' + hhmm(t0) + ' in poi.';
      else if (fin <= ini) msg = 'La fine deve essere dopo l\'inizio.';
      else if (fin - ini > 12 * 3600e3) msg = 'Fermo più lungo di 12 ore: controlla gli orari.';
      if (FILL && !msg) { // orari toccati a mano → dichiarati; altrimenti restano quelli reali
        const iniReale = Math.floor(f.start / 60000) * 60000, finReale = Math.floor(now / 60000) * 60000;
        if (ini !== iniReale || fin !== finReale) dich = true; else { ini = f.start; fin = now; }
      }
    }
    if (msg) { const e = $('#err'); e.textContent = msg; e.hidden = false; return; }
    const lotto = $('#clotto').value.trim();
    if (REG) enqueue({ action: 'open', id: f.id, code: f.code, linea: f.linea, macchina: f.macchina, lotto, ts: ini, turno: turnoOf(ini), manutentore: S.man, foto: '', dichiarato: true, reg: now });
    enqueue({ action: 'close', id: f.id, ts: fin, inizio: FILL && dich && ini !== f.start ? ini : undefined, manutentore: S.man, categoria: C.cat, intervento: C.int, guasto: C.guasto,
      altro, pezzo: sost() ? $('#pezzo').value.trim() : '', lotto, foto: C.img ? toJpeg(C.img, C.circles) : '', dichiarato: dich || undefined, reg: now });
    delete PRE_G[f.id]; save('preg', PRE_G);
    closeSh(); toast((REG ? 'Fermo registrato · ' : 'Fermo chiuso · ') + fmtDur((fin - ini) / 60000));
  };
  const cb = $('#canc');
  if (cb) cb.onclick = () => {
    if (!cb.dataset.armed) { cb.dataset.armed = 1; cb.textContent = 'Tocca ancora per annullare il fermo'; return; }
    enqueue({ action: 'cancel', id: f.id, manutentore: S.man }); closeSh(); toast('Fermo annullato');
  };
}

/* ================= Avvio ================= */
setInterval(() => {
  const n = Date.now();
  $$('[data-since]').forEach(e => e.textContent = fmtTimer(n - +e.dataset.since));
  const d = new Date(); $('#clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ' · turno ' + turnoOf(n);
}, 1000);
/* ---- Aggiornamenti: quando su GitHub esce una versione nuova l'app si ricarica da sola ---- */
let APP_VER = null;
async function checkUpdate() {
  if (!navigator.onLine) return;
  let v = null;
  try { const r = await fetch('index.html', { method: 'HEAD', cache: 'no-store' }); v = r.ok && (r.headers.get('etag') || r.headers.get('last-modified')); } catch {}
  if (!v) return;
  if (!APP_VER) { APP_VER = v; return; }
  if (v === APP_VER) return;
  // non ricaricare mentre qualcuno sta compilando qualcosa
  const busy = $('#sheet').innerHTML || $('#scanwrap').innerHTML || S.view.name === 'anoform';
  if (busy) $('#upd').hidden = false; else location.reload();
}
(function boot() {
  const c = load('cache', null);
  if (c) { S.equipment = c.equipment || S.equipment; S.liste = c.liste || S.liste; S.guasti = c.guasti || {}; S.fermi = c.fermi || [];
    S.soluzioni = c.soluzioni || []; S.documenti = c.documenti || []; S.anomalie = c.anomalie || []; S.compiti = c.compiti || []; S.vestizioni = c.vestizioni || []; S.turni = c.turni || {}; }
  const url = new URL(location.href), eq = url.searchParams.get('eq'), h = url.hash.slice(1);
  if (['sol', 'doc', 'ano', 'anoform'].includes(h)) S.view = { name: h, code: eq || undefined };
  else if (eq) S.view = { name: 'equip', code: eq };
  S.man = getSession();
  render();
  // aperta dal QR con la fotocamera del telefono (…/?eq=CODICE): dopo l'accesso si va dritti al fermo
  const deep = eq && !h && eqBy(eq);
  if (!S.man) { PENDING_EQ = deep; showLogin(); } else if (deep) afterScan(deep);
  caricaBozzaAno(); sync(); cleanMedia();
  setInterval(() => { if (document.visibilityState === 'visible') { if (!OUTBOX.length) refresh(); checkUpdate(); } }, 60000);
  checkUpdate();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { sync(); checkUpdate(); } });
  window.addEventListener('online', sync);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
